# Wazuh workers StatefulSet

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-worker
  namespace: wazuh-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: worker
  serviceName: wazuh-cluster
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: worker
        syslog-ng: "true"
      name: wazuh-manager-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: wazuh-manager
                    node-type: worker
      volumes:
        - name: config
          configMap:
            name: wazuh-conf
        - name: filebeat-certs
          secret:
            secretName: indexer-certs
        - name: syslog-ng-config-volume
          configMap:
            name: syslog-ng-config      
        - name: syslog-ng-tlskey-volume
          configMap:
            name: syslog-ng-tlskey
        - name: syslog-ng-tlscrt-volume
          configMap:
            name: syslog-ng-tlscrt
        - name: syslog-ng-ca-volume
          configMap:
            name: syslog-ng-ca            
        - name: syslog-ng-tls-writable
          emptyDir: {}            
        - name: syslog-ng-entrypoint-volume
          configMap:
            name: syslog-ng-entrypoint          
      securityContext:
        fsGroup: 101
      containers:
        - name: wazuh-manager
          image: 'wazuh/wazuh-manager:4.12.0'
          resources:
            limits:
              cpu: 400m
              memory: 512Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true          
            capabilities:
              add: ["SYS_CHROOT", "NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: worker.conf
              readOnly: true
            - name: filebeat-certs
              mountPath: /etc/ssl/root-ca.pem
              readOnly: true
              subPath: root-ca.pem
            - name: filebeat-certs
              mountPath: /etc/ssl/filebeat.pem
              subPath: filebeat.pem
              readOnly: true
            - name: filebeat-certs
              mountPath: /etc/ssl/filebeat.key
              subPath: filebeat-key.pem
              readOnly: true
            - name: wazuh-manager-worker
              mountPath: /var/ossec/api/configuration
              subPath: wazuh/var/ossec/api/configuration
            - name: wazuh-manager-worker
              mountPath: /var/ossec/etc
              subPath: wazuh/var/ossec/etc
            - name: wazuh-manager-worker
              mountPath: /var/ossec/logs
              subPath: wazuh/var/ossec/logs
            - name: wazuh-manager-worker
              mountPath: /var/ossec/queue
              subPath: wazuh/var/ossec/queue
            - name: wazuh-manager-worker
              mountPath: /var/ossec/var/multigroups
              subPath: wazuh/var/ossec/var/multigroups
            - name: wazuh-manager-worker
              mountPath: /var/ossec/integrations
              subPath: wazuh/var/ossec/integrations
            - name: wazuh-manager-worker
              mountPath: /var/ossec/active-response/bin
              subPath: wazuh/var/ossec/active-response/bin
            - name: wazuh-manager-worker
              mountPath: /var/ossec/agentless
              subPath: wazuh/var/ossec/agentless
            - name: wazuh-manager-worker
              mountPath: /var/ossec/wodles
              subPath: wazuh/var/ossec/wodles
            - name: wazuh-manager-worker
              mountPath: /etc/filebeat
              subPath: filebeat/etc/filebeat
            - name: wazuh-manager-worker
              mountPath: /var/lib/filebeat
              subPath: filebeat/var/lib/filebeat
          #   - name: syslog-ng-config    ###########
          #     mountPath: /usr/local/bin/syslog-install.sh
          #     subPath: syslog-install.sh
          # lifecycle:
          #   postStart:
          #     exec:
          #       command: ["/bin/bash", "-c", "/usr/local/bin/syslog-install.sh"]                                   
          ports:
            - containerPort: 1514
              name: agents-events
            - containerPort: 1516
              name: cluster
            - containerPort: 514
              name: syslog-events                
          env:
            - name: INDEXER_URL
              value: 'https://indexer:9200'
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: password
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: 'full'
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: /etc/ssl/root-ca.pem
            - name: SSL_CERTIFICATE
              value: /etc/ssl/filebeat.pem
            - name: SSL_KEY
              value: /etc/ssl/filebeat.key
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-cluster-key
                  key: key
        - name: syslog-ng
          image: balabit/syslog-ng:4.8.0  
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true         
          volumeMounts:
            - name: syslog-ng-config-volume
              mountPath: /etc/syslog-ng/syslog-ng.conf
              subPath: syslog-ng.conf
            - name: syslog-ng-tls-writable  #EmptyDir
              mountPath: /etc/syslog-ng/tls              
            - name: syslog-ng-tlskey-volume
              mountPath: /tmp/tls/tls.key
              subPath: tls.key
            - name: syslog-ng-tlscrt-volume
              mountPath: /tmp/tls/tls.crt
              subPath: tls.crt
            - name: syslog-ng-ca-volume
              mountPath: /tmp/tls/ca.crt
              subPath: ca.crt
            - name: syslog-ng-entrypoint-volume
              mountPath: /usr/local/bin/entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true      
          command: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]                                                          
          ports:
            - containerPort: 6514
              name: syslog-tls                   
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-worker
        namespace: wazuh-dev
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: wazuh-storage-dev
        resources:
          requests:
            storage: 500Mi
