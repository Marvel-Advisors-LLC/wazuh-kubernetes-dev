apiVersion: v1
kind: Service
metadata:
  name: syslog-ng
  namespace: wazuh-dev
spec:
  selector:
    syslog-ng: "true"
  ports:
    - name: syslog-tcp
      port: 514
      protocol: TCP
      targetPort: 514
    - name: syslog-tls
      port: 6514
      protocol: TCP
      targetPort: 6514
  type: ClusterIP