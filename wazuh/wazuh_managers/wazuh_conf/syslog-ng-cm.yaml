apiVersion: v1
kind: ConfigMap
metadata:
  name: syslog-ng-config
  namespace: wazuh-dev
data:
  syslog-ng.conf: |
    @version:4.7
    @include "scl.conf"

    options {
        flush_lines(0);
        time_reopen(10);
        log_fifo_size(1000);
        chain_hostnames(off);
        use_dns(no);
        use_fqdn(no);
        create_dirs(no);
        keep_hostname(yes);
    };

    # TLS source on port 6514
    source s_tls {
        tcp(
            ip("0.0.0.0")
            port(6514)
            tls(
                key-file("/etc/syslog-ng/tls/tls.key")
                cert-file("/etc/syslog-ng/tls/tls.crt")
                ca-file("/etc/syslog-ng/tls/ca.crt")
                peer-verify(optional-untrusted)
            )
        );
    };

    # Destination: forward to local Wazuh
    destination d_wazuh { tcp("127.0.0.1" port(514)); };

    # For optional debug: stdout
    destination d_stdout { file("/dev/stdout"); };

    # Pipeline: everything received via TLS goes to Wazuh and optionally to stdout
    log { source(s_tls); destination(d_wazuh); };
    log { source(s_tls); destination(d_stdout); };